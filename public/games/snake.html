<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grid Snake</title>
  <style>
    :root {
      --bg: #0e1116;
      --surface: #161b22;
      --border: rgba(255, 255, 255, 0.1);
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent: #f59e0b;
      --snake-head: #34d399;
      --snake-body: #10b981;
      --food: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
    }
    .shell {
      width: 100%;
      max-width: 560px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .hud {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    .stats {
      display: flex;
      gap: 20px;
      font-size: 13px;
      color: var(--muted);
    }
    .stats strong {
      color: var(--text);
      font-variant-numeric: tabular-nums;
      font-family: ui-monospace, SFMono-Regular, monospace;
      margin-left: 6px;
    }
    .hud-actions {
      display: flex;
      gap: 8px;
    }
    button {
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #1f2630;
      color: var(--text);
      cursor: pointer;
      white-space: nowrap;
      transition: background 150ms ease, transform 120ms ease;
    }
    button:hover { background: #28313e; }
    button:active { transform: scale(0.97); }
    button.primary {
      background: var(--accent);
      color: #111827;
      border-color: transparent;
      padding: 10px 22px;
      font-size: 14px;
    }
    button.primary:hover { background: #fbbf24; }
    .stage {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      max-height: 70vh;
      background: #121720;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(14, 17, 22, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      gap: 14px;
    }
    .overlay.hidden { display: none; }
    .overlay h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
    .overlay p { font-size: 14px; color: var(--muted); max-width: 300px; line-height: 1.5; }
    .speed-row {
      display: flex;
      gap: 6px;
      background: var(--surface);
      padding: 4px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .speed-btn.active {
      background: var(--accent);
      color: #111827;
      border-color: transparent;
    }
    .touch-pad {
      display: none;
      grid-template-columns: repeat(3, 52px);
      gap: 6px;
      justify-content: center;
    }
    .touch-pad button { height: 44px; font-size: 16px; }
    @media (pointer: coarse) {
      .touch-pad { display: grid; }
      .stage { max-height: 54vh; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="hud">
      <div class="stats">
        <span>Score<strong id="score">0</strong></span>
        <span>Best<strong id="best">0</strong></span>
      </div>
      <div class="hud-actions">
        <button id="pauseBtn" type="button">Pause</button>
        <button id="muteBtn" type="button">Sound On</button>
      </div>
    </div>

    <div class="stage">
      <canvas id="board" width="480" height="480"></canvas>
      <div class="overlay" id="overlay">
        <h1 id="overlayTitle">Grid Snake</h1>
        <p id="overlayDesc">Use Arrow Keys or WASD to steer. Collect amber apples to grow without hitting walls or yourself.</p>
        <div class="speed-row" id="speedRow">
          <button type="button" class="speed-btn" data-speed="130">Relaxed</button>
          <button type="button" class="speed-btn active" data-speed="95">Standard</button>
          <button type="button" class="speed-btn" data-speed="65">Fast</button>
        </div>
        <button id="startBtn" class="primary" type="button">Start Game</button>
      </div>
    </div>

    <div class="touch-pad" aria-label="Directional controls">
      <span></span>
      <button type="button" data-dir="up" aria-label="Up">▲</button>
      <span></span>
      <button type="button" data-dir="left" aria-label="Left">◀</button>
      <button type="button" data-dir="down" aria-label="Down">▼</button>
      <button type="button" data-dir="right" aria-label="Right">▶</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('board');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlayDesc = document.getElementById('overlayDesc');
    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const muteBtn = document.getElementById('muteBtn');
    const speedRow = document.getElementById('speedRow');

    const GRID = 20;
    const CELL = canvas.width / GRID;
    const STORAGE_KEY = 'arcadevault_snake_best';

    let state = 'TITLE_MENU';
    let snake = [];
    let dir = { x: 1, y: 0 };
    let nextDir = { x: 1, y: 0 };
    let food = { x: 14, y: 10 };
    let score = 0;
    let best = Number(localStorage.getItem(STORAGE_KEY) || 0);
    let tickMs = 95;
    let timer = null;
    let muted = false;
    let audioCtx = null;

    bestEl.textContent = String(best);

    function playTone(freq, dur, type = 'sine', vol = 0.06) {
      if (muted) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch {}
    }

    function spawnFood() {
      const occupied = new Set(snake.map(s => `${s.x},${s.y}`));
      const free = [];
      for (let y = 0; y < GRID; y++) {
        for (let x = 0; x < GRID; x++) {
          if (!occupied.has(`${x},${y}`)) free.push({ x, y });
        }
      }
      if (free.length === 0) return;
      food = free[Math.floor(Math.random() * free.length)];
    }

    function resetGame() {
      snake = [{ x: 8, y: 10 }, { x: 7, y: 10 }, { x: 6, y: 10 }];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      scoreEl.textContent = '0';
      spawnFood();
    }

    function startGame() {
      clearInterval(timer);
      resetGame();
      state = 'PLAYING';
      overlay.classList.add('hidden');
      pauseBtn.textContent = 'Pause';
      draw();
      timer = setInterval(step, tickMs);
    }

    function togglePause() {
      if (state === 'PLAYING') {
        state = 'PAUSED';
        clearInterval(timer);
        overlayTitle.textContent = 'Paused';
        overlayDesc.textContent = 'Take a breather or resume right where you left off.';
        startBtn.textContent = 'Resume';
        speedRow.style.display = 'none';
        overlay.classList.remove('hidden');
        pauseBtn.textContent = 'Resume';
      } else if (state === 'PAUSED') {
        state = 'PLAYING';
        overlay.classList.add('hidden');
        pauseBtn.textContent = 'Pause';
        timer = setInterval(step, tickMs);
      }
    }

    function endGame() {
      clearInterval(timer);
      state = 'GAME_OVER';
      playTone(170, 0.22, 'sawtooth', 0.05);
      if (score > best) {
        best = score;
        localStorage.setItem(STORAGE_KEY, String(best));
        bestEl.textContent = String(best);
      }
      overlayTitle.textContent = 'Game Over';
      overlayDesc.textContent = `Final score: ${score}. Best record: ${best}.`;
      startBtn.textContent = 'Play Again';
      speedRow.style.display = 'flex';
      overlay.classList.remove('hidden');
    }

    function step() {
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
      if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) {
        return endGame();
      }
      const hitsBody = snake.some((seg, idx) => idx < snake.length - 1 && seg.x === head.x && seg.y === head.y);
      if (hitsBody) return endGame();

      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = String(score);
        playTone(540, 0.09, 'triangle', 0.07);
        spawnFood();
      } else {
        snake.pop();
      }
      draw();
    }

    function draw() {
      ctx.fillStyle = '#121720';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = 'rgba(255,255,255,0.035)';
      ctx.lineWidth = 1;
      for (let i = 1; i < GRID; i++) {
        ctx.beginPath();
        ctx.moveTo(i * CELL, 0);
        ctx.lineTo(i * CELL, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * CELL);
        ctx.lineTo(canvas.width, i * CELL);
        ctx.stroke();
      }

      // Food
      ctx.fillStyle = '#f59e0b';
      ctx.beginPath();
      ctx.roundRect(food.x * CELL + 4, food.y * CELL + 4, CELL - 8, CELL - 8, 5);
      ctx.fill();

      // Snake
      snake.forEach((seg, i) => {
        ctx.fillStyle = i === 0 ? '#34d399' : '#10b981';
        const pad = i === 0 ? 2 : 3;
        ctx.beginPath();
        ctx.roundRect(seg.x * CELL + pad, seg.y * CELL + pad, CELL - pad * 2, CELL - pad * 2, 5);
        ctx.fill();
      });
    }

    function setDirection(nx, ny) {
      if (dir.x === -nx && dir.y === -ny) return;
      nextDir = { x: nx, y: ny };
    }

    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
        e.preventDefault();
      }
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') setDirection(0, -1);
      else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') setDirection(0, 1);
      else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') setDirection(-1, 0);
      else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') setDirection(1, 0);
      else if (e.key === 'p' || e.key === 'P') togglePause();
      else if (e.key === 'Enter' && state !== 'PLAYING') {
        if (state === 'PAUSED') togglePause();
        else startGame();
      }
    });

    startBtn.addEventListener('click', () => {
      if (state === 'PAUSED') togglePause();
      else startGame();
    });
    pauseBtn.addEventListener('click', togglePause);
    muteBtn.addEventListener('click', () => {
      muted = !muted;
      muteBtn.textContent = muted ? 'Muted' : 'Sound On';
    });

    speedRow.addEventListener('click', (e) => {
      const btn = e.target.closest('.speed-btn');
      if (!btn) return;
      speedRow.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      tickMs = Number(btn.dataset.speed);
    });

    document.querySelectorAll('[data-dir]').forEach(btn => {
      btn.addEventListener('click', () => {
        const d = btn.dataset.dir;
        if (d === 'up') setDirection(0, -1);
        if (d === 'down') setDirection(0, 1);
        if (d === 'left') setDirection(-1, 0);
        if (d === 'right') setDirection(1, 0);
      });
    });

    resetGame();
    draw();
  </script>
</body>
</html>
